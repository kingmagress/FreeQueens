<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECEEF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121419" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Queens">
<title>Queens</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23AE98E6'/%3E%3Cpath d='M5.5 17 4 8.5l4.5 4L12 6l3.5 6.5 4.5-4L18.5 17z' fill='%23262A33'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --bg: #ECEEF2;
    --surface: #FFFFFF;
    --ink: #262A33;
    --muted: #5E6573;
    --rule: rgba(38, 42, 51, 0.14);
    --lead: #262A33;
    --thin: rgba(38, 42, 51, 0.22);
    --gold: #B8892B;
    --on-gold: #1E1A10;
    --piece: #1E2128;
    --mark: rgba(30, 33, 40, 0.62);
    --mark-auto: rgba(30, 33, 40, 0.3);
    --danger: #B3261E;
    --heart: #D2443A;
    --focus: #2C64D8;

    --r0: #E8837A; --r1: #F2B35E; --r2: #F4DC6E; --r3: #9CCB86;
    --r4: #6FC2B4; --r5: #86AEE8; --r6: #AE98E6; --r7: #EE9CC8;
    --r8: #CDB48C; --r9: #B9C0CA; --r10: #C7DD6F;

    --display: Didot, "Bodoni 72", "Bodoni MT", "Playfair Display", Georgia, serif;
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #121419;
      --surface: #1C1F26;
      --ink: #E7E9EE;
      --muted: #9AA1AE;
      --rule: rgba(231, 233, 238, 0.14);
      --lead: #050608;
      --thin: rgba(0, 0, 0, 0.38);
      --gold: #D9A940;
      --piece: #15171C;
      --mark: rgba(10, 11, 14, 0.66);
      --mark-auto: rgba(10, 11, 14, 0.34);
      --danger: #FFB4AB;
      --heart: #FF6B60;
      --focus: #8AB4FF;

      --r0: #C2574E; --r1: #C98A33; --r2: #C9B03F; --r3: #5F9E4D;
      --r4: #2F9888; --r5: #5585CC; --r6: #8169C8; --r7: #C2609A;
      --r8: #A08656; --r9: #808997; --r10: #93AC37;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 16px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  [hidden] { display: none !important; }

  .app {
    max-width: 560px;
    margin: 0 auto;
    padding:
      max(14px, env(safe-area-inset-top))
      max(14px, env(safe-area-inset-right))
      max(24px, env(safe-area-inset-bottom))
      max(14px, env(safe-area-inset-left));
  }
  h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1; }

  /* ---------- Buttons ---------- */
  .btn {
    height: 46px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    background: var(--surface);
    color: var(--ink);
    font: 600 0.95rem/1 var(--ui);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn.big { width: 100%; height: 54px; font-size: 1.05rem; }
  button:focus-visible, summary:focus-visible, .switch input:focus-visible + .track {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  /* ---------- Home ---------- */
  .home-top { margin: 8px 0 18px; }
  .home-title { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .icon-btn {
    flex: none;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn[aria-pressed="false"] { color: var(--muted); }
  .bar-right { display: flex; align-items: center; gap: 12px; }
  .bar .icon-btn { width: 36px; height: 36px; }
  .home-top h1 { font-size: 3.4rem; letter-spacing: -0.01em; }
  .summary { margin: 8px 0 0; color: var(--muted); }

  .band { margin-top: 28px; }
  .band-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding-bottom: 8px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--rule);
  }
  .band-head h2 { font-size: 1.7rem; }
  .band-head span { color: var(--muted); font-size: 0.9rem; }
  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
    gap: 8px;
  }
  .tile {
    aspect-ratio: 1 / 1;
    padding: 0;
    border-radius: 10px;
    border: 1px solid var(--rule);
    background: var(--surface);
    color: var(--ink);
    font: 700 1rem/1 var(--ui);
    font-variant-numeric: tabular-nums;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .tile.done { background: var(--c); border: 2px solid var(--lead); color: var(--piece); }
  .tile.current { border: 2px solid var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 28%, transparent); }
  .tile.fresh { animation: tilepop 0.6s cubic-bezier(.3,1.6,.5,1) 0.25s both; }
  @keyframes tilepop { 0% { transform: scale(0.6); } 100% { transform: scale(1); } }
  .tstars { display: flex; gap: 1px; }
  .tstars svg { width: 10px; height: 10px; }
  .tstars .on { fill: currentColor; }
  .tstars .off { fill: none; stroke: currentColor; stroke-width: 2.2; opacity: 0.45; }

  .home-foot { margin-top: 32px; text-align: center; }
  .link {
    background: none;
    border: 0;
    color: var(--muted);
    font: 500 0.9rem var(--ui);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 8px;
  }

  /* ---------- Play ---------- */
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    background: none;
    border: 0;
    color: var(--ink);
    font: 600 0.95rem var(--ui);
    padding: 8px 10px 8px 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .back svg { width: 20px; height: 20px; }
  .clock { font-size: 1.05rem; font-variant-numeric: tabular-nums; color: var(--muted); }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 12px; }
  .head h1 { font-size: 2.4rem; }
  .level-size { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
  .lives { display: flex; gap: 4px; padding-bottom: 4px; }
  .heart { width: 28px; height: 28px; }
  .heart path { fill: var(--heart); }
  .heart.gone path { fill: none; stroke: var(--muted); stroke-width: 1.6; opacity: 0.6; }
  .heart.breaking { animation: heartbreak 0.6s ease-out; }
  @keyframes heartbreak {
    0% { transform: scale(1.35); }
    30% { transform: scale(0.75) rotate(-10deg); }
    100% { transform: scale(1) rotate(0); }
  }

  .stage {
    position: relative;
    margin: 0 auto;
    aspect-ratio: 1 / 1;
    width: min(100%, max(260px, calc(100vh - 300px)));
    width: min(100%, max(260px, calc(100svh - 300px)));
  }
  .board {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr));
    grid-template-rows: repeat(var(--n, 5), minmax(0, 1fr));
    border: 4px solid var(--lead);
    border-radius: 14px;
    overflow: hidden;
    background: var(--lead);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    --tw: 3px;
    transition: opacity 0.2s;
  }
  .board.dense { --tw: 2.5px; }
  .board.busy { opacity: 0.3; }
  .board::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0) 45%);
    z-index: 2;
  }

  .cell {
    position: relative;
    appearance: none;
    -webkit-appearance: none;
    margin: 0;
    padding: 0;
    min-width: 0;
    min-height: 0;
    border: 0;
    border-right: 1px solid var(--thin);
    border-bottom: 1px solid var(--thin);
    border-radius: 0;
    background: var(--c);
    display: grid;
    place-items: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    font: inherit;
    color: var(--piece);
  }
  .cell.br { border-right: var(--tw) solid var(--lead); }
  .cell.bb { border-bottom: var(--tw) solid var(--lead); }
  .cell.er { border-right: 0; }
  .cell.eb { border-bottom: 0; }
  .cell:focus { outline: none; }
  .cell:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; z-index: 3; }
  .cell svg { display: block; pointer-events: none; }
  .cell .q { width: 66%; height: 66%; }
  .cell .x { width: 34%; height: 34%; color: var(--mark); }
  .cell .ax { width: 24%; height: 24%; color: var(--mark-auto); }
  .cell .m { width: 42%; height: 42%; color: var(--danger); }
  @media (prefers-color-scheme: dark) { .cell .m { filter: drop-shadow(0 0 1.5px #000); } }

  .cell.set .q { animation: rise 0.45s cubic-bezier(.3,1.6,.5,1); }
  .cell.oops { animation: shake 0.36s ease-in-out; }
  .cell.oops::before, .cell.flash::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 0 4px var(--danger);
    animation: ring 1.1s ease-out forwards;
  }
  .cell.flash::before { box-shadow: inset 0 0 0 4px var(--gold); }
  @keyframes ring { 0%, 55% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-7%); }
    75% { transform: translateX(7%); }
  }

  /* Level complete: light sweeps across the glass, crowns rise row by row */
  .board.won::after {
    content: "";
    position: absolute;
    inset: -10%;
    pointer-events: none;
    z-index: 4;
    background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,0.6) 50%, transparent 62%);
    transform: translateX(-110%);
    animation: sweep 1.15s ease-out 0.15s forwards;
  }
  .board.won .q { animation: rise 0.45s cubic-bezier(.3,1.6,.5,1) var(--d, 0ms) both; }
  @keyframes sweep { to { transform: translateX(110%); } }
  @keyframes rise {
    0% { transform: scale(1); }
    45% { transform: scale(1.28) translateY(-6%); }
    100% { transform: scale(1); }
  }
  .board.lost { filter: grayscale(0.7); opacity: 0.75; transition: filter 0.4s, opacity 0.4s; }

  /* Placing a queen lights up its whole region, rippling out from the queen */
  .cell.glow { animation: glow 0.8s ease-out var(--gd, 0ms) both; }
  @keyframes glow {
    0% { filter: none; }
    35% { filter: brightness(1.25) saturate(1.15); }
    100% { filter: none; }
  }
  .stage.shake { animation: boardshake 0.42s cubic-bezier(.36,.07,.19,.97); }
  @keyframes boardshake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-7px); }
    40%, 60% { transform: translateX(7px); }
  }
  .floater {
    position: fixed;
    z-index: 21;
    pointer-events: none;
    padding: 4px 11px;
    border-radius: 999px;
    background: var(--surface);
    box-shadow: 0 4px 14px rgba(0,0,0,0.22);
    font: 700 0.95rem/1.2 var(--ui);
    white-space: nowrap;
    transform: translate(-50%, -50%);
    animation: floatup 1.1s ease-out forwards;
  }
  .floater.bad { color: var(--danger); }
  .floater.good { color: var(--gold); }
  @keyframes floatup {
    0% { opacity: 0; transform: translate(-50%, -20%) scale(0.7); }
    15% { opacity: 1; transform: translate(-50%, -70%) scale(1.06); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -190%) scale(1); }
  }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

  .loading {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 0.95rem;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .loading.show { opacity: 1; }

  .status { min-height: 1.45em; margin: 10px 0; text-align: center; font-size: 0.95rem; color: var(--muted); }
  .status.alert { color: var(--danger); }
  @media (prefers-color-scheme: light) { .status.alert { color: #A3241C; } }

  .actions { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 8px; }
  .extras { display: flex; justify-content: center; margin-top: 16px; }
  .switch { display: inline-flex; align-items: center; gap: 10px; font-size: 0.95rem; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .track {
    position: relative;
    flex: none;
    width: 42px;
    height: 24px;
    border-radius: 999px;
    background: var(--rule);
    border: 1px solid var(--rule);
    transition: background 0.15s;
  }
  .track::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--surface);
    box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    transition: transform 0.15s;
  }
  .switch input:checked + .track { background: var(--ink); border-color: var(--ink); }
  .switch input:checked + .track::after { transform: translateX(18px); background: var(--bg); }

  .rules { margin-top: 20px; border-top: 1px solid var(--rule); padding-top: 12px; }
  .rules summary { cursor: pointer; font-weight: 600; font-size: 0.95rem; width: fit-content; margin: 0 auto; }
  .rules p, .rules ul { max-width: 62ch; margin: 10px auto 0; font-size: 0.95rem; color: var(--muted); }
  .rules ul { padding-left: 1.2em; }
  .rules li + li { margin-top: 4px; }
  .home .rules { margin-top: 18px; }

  /* ---------- Dialog ---------- */
  .dialog-wrap {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(10, 12, 16, 0.45);
    z-index: 10;
    animation: fade 0.25s ease-out;
  }
  .dialog {
    width: min(100%, 360px);
    background: var(--surface);
    color: var(--ink);
    border-radius: 18px;
    padding: 24px 22px 20px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(0,0,0,0.28);
  }
  .dialog h2 { font-size: 2.1rem; line-height: 1.1; margin-bottom: 10px; }
  .dstars { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; }
  .dstars:empty { display: none; }
  .dstars svg { width: 38px; height: 38px; }
  .dstars .on { fill: var(--gold); animation: starpop 0.4s cubic-bezier(.3,1.6,.5,1) both; }
  .dstars .off { fill: none; stroke: var(--muted); stroke-width: 1.4; opacity: 0.6; }
  @keyframes starpop { from { transform: scale(0.2); opacity: 0; } }
  .dialog p { margin: 0 0 18px; color: var(--muted); }
  .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dialog-actions.single { grid-template-columns: 1fr; }
  @keyframes fade { from { opacity: 0; } }

  @media (max-width: 370px) {
    .home-top h1 { font-size: 2.9rem; }
    .head h1 { font-size: 2.1rem; }
    .btn { font-size: 0.88rem; padding: 0 10px; }
    .actions { gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .board.won::after { display: none; }
  }
</style>
</head>
<body>
<main class="app">

  <section id="home" class="home">
    <header class="home-top">
      <div class="home-title">
        <h1>Queens</h1>
        <button class="icon-btn sound-btn" aria-label="Sound effects" aria-pressed="true"></button>
      </div>
      <p class="summary" id="summary"></p>
    </header>
    <button class="btn primary big" id="continue">Play level 1</button>
    <details class="rules" id="rules-home"><summary>How to play</summary><div class="rules-body"></div></details>
    <div id="bands"></div>
    <div class="home-foot"><button class="link" id="reset">Reset progress</button></div>
  </section>

  <section id="play" hidden>
    <div class="bar">
      <button class="back" id="back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Levels
      </button>
      <div class="bar-right">
        <div class="clock" id="clock" role="timer" aria-label="Elapsed time">0:00</div>
        <button class="icon-btn sound-btn" aria-label="Sound effects" aria-pressed="true"></button>
      </div>
    </div>
    <div class="head">
      <div>
        <h1 id="level-title">Level 1</h1>
        <div class="level-size" id="level-size">5 × 5 board</div>
      </div>
      <div class="lives" id="lives" role="img" aria-label="3 lives left"></div>
    </div>

    <div class="stage" id="stage">
      <div class="board busy" id="board" role="grid" aria-label="Puzzle board"></div>
      <div class="loading show" id="loading">Building level…</div>
    </div>

    <p class="status" id="status" aria-live="polite"></p>

    <div class="actions">
      <button class="btn" id="undo" disabled>Undo</button>
      <button class="btn" id="clear" disabled>Clear marks</button>
      <button class="btn" id="hint">Hint (1)</button>
    </div>

    <div class="extras">
      <label class="switch">
        <input type="checkbox" id="autox" role="switch">
        <span class="track" aria-hidden="true"></span>
        Auto-mark blocked squares
      </label>
    </div>
    <details class="rules"><summary>How to play</summary><div class="rules-body"></div></details>
  </section>
</main>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="dialog-wrap" id="dlg" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <h2 id="dlg-title"></h2>
    <div class="dstars" id="dlg-stars"></div>
    <p id="dlg-text"></p>
    <div class="dialog-actions" id="dlg-actions">
      <button class="btn" id="dlg-alt"></button>
      <button class="btn primary" id="dlg-main"></button>
    </div>
  </div>
</div>

<script>
/* ---------- Puzzle generator (also runs inside a Web Worker) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a,rng){for(let i=a.length-1;i>0;i--){const j=rng()*(i+1)|0;const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function nbrs(n,i){const r=i/n|0,c=i%n,o=[];if(r>0)o.push(i-n);if(r<n-1)o.push(i+n);if(c>0)o.push(i-1);if(c<n-1)o.push(i+1);return o;}

// Random valid queen layout: one per row and column, no two touching.
function randomPlacement(n,rng){
  const p=new Array(n),used=new Array(n).fill(false);
  (function bt(r){
    if(r===n)return true;
    for(const c of shuffle([...Array(n).keys()],rng)){
      if(used[c]||(r>0&&Math.abs(p[r-1]-c)<=1))continue;
      used[c]=true;p[r]=c;
      if(bt(r+1))return true;
      used[c]=false;
    }
    return false;
  })(0);
  return p;
}

// Grow one region from each queen, at uneven rates for varied shapes.
function growRegions(n,sol,rng){
  const reg=new Int8Array(n*n).fill(-1),w=[];
  for(let i=0;i<n;i++){reg[i*n+sol[i]]=i;w.push(0.1+rng()**2);}
  let left=n*n-n;
  while(left>0){
    const front=Array.from({length:n},()=>[]);
    for(let i=0;i<n*n;i++){
      if(reg[i]!==-1)continue;
      for(const j of nbrs(n,i))if(reg[j]>=0)front[reg[j]].push(i);
    }
    let tot=0;for(let g=0;g<n;g++)if(front[g].length)tot+=w[g];
    let x=rng()*tot,g=0;
    for(;g<n;g++){if(!front[g].length)continue;x-=w[g];if(x<=0)break;}
    if(g>=n||!front[g].length)g=front.findIndex(f=>f.length);
    reg[front[g][rng()*front[g].length|0]]=g;left--;
  }
  return reg;
}

// Count solutions, stopping at `limit`.
function solve(n,reg,limit,out){
  const uc=new Uint8Array(n),ur=new Uint8Array(n),p=new Int8Array(n);let count=0;
  (function bt(r){
    if(r===n){count++;if(out)out.push(Array.from(p));return count>=limit;}
    for(let c=0;c<n;c++){
      if(uc[c])continue;
      const g=reg[r*n+c];
      if(ur[g])continue;
      if(r>0&&Math.abs(p[r-1]-c)<=1)continue;
      uc[c]=1;ur[g]=1;p[r]=c;
      if(bt(r+1))return true;
      uc[c]=0;ur[g]=0;
    }
    return false;
  })(0);
  return count;
}

// Move cell X into region h; any piece of X's old region cut off from its queen goes too.
function moveCell(n,reg,X,h,seed){
  const g=reg[X];reg[X]=h;
  const seen=new Uint8Array(n*n),st=[seed];seen[seed]=1;
  while(st.length){const i=st.pop();for(const j of nbrs(n,i))if(!seen[j]&&reg[j]===g){seen[j]=1;st.push(j);}}
  for(let i=0;i<n*n;i++)if(reg[i]===g&&!seen[i])reg[i]=h;
}

// Pick region colors so look-alike colors rarely sit next to each other.
function assignColors(n,reg,rng){
  const SIM=[[2,10],[3,10],[1,8],[0,7],[5,6],[3,4],[8,9],[1,2],[0,1]];
  const sim=new Set();SIM.forEach(([a,b])=>{sim.add(a*16+b);sim.add(b*16+a);});
  const adj=new Set();
  for(let i=0;i<n*n;i++){
    const c=i%n;
    if(c<n-1&&reg[i]!==reg[i+1])adj.add(Math.min(reg[i],reg[i+1])*16+Math.max(reg[i],reg[i+1]));
    if(i+n<n*n&&reg[i]!==reg[i+n])adj.add(Math.min(reg[i],reg[i+n])*16+Math.max(reg[i],reg[i+n]));
  }
  let best=null,bestScore=1e9;
  for(let k=0;k<120&&bestScore>0;k++){
    const cols=shuffle([...Array(11).keys()],rng).slice(0,n);
    let s=0;for(const p of adj)if(sim.has(cols[p>>4]*16+cols[p&15]))s++;
    if(s<bestScore){bestScore=s;best=cols;}
  }
  return best;
}

// Build a puzzle with exactly one solution. The same seed always gives the same puzzle.
function generate(n,seed){
  const rng=mulberry32(seed);
  for(;;){
    const sol=randomPlacement(n,rng),reg=growRegions(n,sol,rng);
    for(let it=0;it<200;it++){
      const sols=[];
      if(solve(n,reg,2,sols)===1)return {reg:Array.from(reg),sol,colors:assignColors(n,reg,rng)};
      const alt=sols.find(s=>s.some((v,i)=>v!==sol[i]));
      let moved=false;
      for(const r of shuffle([...Array(n).keys()],rng)){
        if(alt[r]===sol[r])continue;
        const X=r*n+alt[r],g=reg[X];
        const opts=nbrs(n,X).filter(j=>reg[j]!==g);
        if(!opts.length)continue;
        moveCell(n,reg,X,reg[opts[rng()*opts.length|0]],g*n+sol[g]);
        moved=true;break;
      }
      if(!moved)break;
    }
  }
}

const MAX_LEVEL=200;
const BANDS=[
  {n:5,from:1,to:10,color:0},{n:6,from:11,to:25,color:1},{n:7,from:26,to:45,color:2},
  {n:8,from:46,to:70,color:3},{n:9,from:71,to:100,color:4},{n:10,from:101,to:140,color:5},
  {n:11,from:141,to:200,color:6}
];
function bandOf(L){return BANDS.find(b=>L>=b.from&&L<=b.to);}
function sizeFor(L){return bandOf(L).n;}
function seedFor(L){return ((L*2654435761)%4294967296)^0x5EED1;}

/* ---------- Puzzle supply: background worker, cache, prefetch ---------- */
const cache=new Map(),waiting=new Map();
let worker=null;
function finish(level,p){
  cache.set(level,p);
  const cbs=waiting.get(level)||[];
  waiting.delete(level);
  cbs.forEach(f=>f(p));
}
function localGen(level){setTimeout(()=>finish(level,generate(sizeFor(level),seedFor(level))),20);}
try{
  const src=[mulberry32,shuffle,nbrs,randomPlacement,growRegions,solve,moveCell,assignColors,generate]
    .map(f=>f.toString()).join('\n')+
    '\nonmessage=function(e){postMessage({level:e.data.level,p:generate(e.data.n,e.data.seed)});};';
  worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
  worker.onmessage=e=>finish(e.data.level,e.data.p);
  worker.onerror=()=>{worker=null;for(const L of [...waiting.keys()])localGen(L);};
}catch(_){worker=null;}
function getPuzzle(level,cb){
  if(cache.has(level)){cb(cache.get(level));return;}
  if(waiting.has(level)){waiting.get(level).push(cb);return;}
  waiting.set(level,[cb]);
  if(worker)worker.postMessage({level,n:sizeFor(level),seed:seedFor(level)});
  else localGen(level);
}
function prefetch(level){if(level>=1&&level<=MAX_LEVEL)getPuzzle(level,()=>{});}

/* ---------- Sound: synthesized with Web Audio, no files needed ---------- */
const Sound=(()=>{
  let ctx=null,master=null,noiseBuf=null,lastTick=0;
  function ensure(){
    if(!P.sound)return null;
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      try{ctx=new AC();}catch(_){return null;}
      master=ctx.createGain();master.gain.value=0.55;master.connect(ctx.destination);
      noiseBuf=ctx.createBuffer(1,ctx.sampleRate*0.5,ctx.sampleRate);
      const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    if(ctx.state==='suspended')ctx.resume().catch(()=>{});
    return ctx;
  }
  function env(g,t0,v,a,d){
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(v,t0+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  }
  function tone({f=440,to=0,type='sine',at=0,d=0.2,v=0.2,a=0.006,lp=0}){
    const c=ensure();if(!c)return;
    const t0=c.currentTime+at,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t0);
    if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);
    env(g,t0,v,a,d);
    if(lp){const b=c.createBiquadFilter();b.type='lowpass';b.frequency.value=lp;o.connect(b);b.connect(g);}else o.connect(g);
    g.connect(master);o.start(t0);o.stop(t0+d+0.05);
  }
  function noise({at=0,d=0.05,v=0.15,hp=2000}){
    const c=ensure();if(!c)return;
    const t0=c.currentTime+at,src=c.createBufferSource(),b=c.createBiquadFilter(),g=c.createGain();
    src.buffer=noiseBuf;b.type='highpass';b.frequency.value=hp;
    env(g,t0,v,0.002,d);
    src.connect(b);b.connect(g);g.connect(master);src.start(t0);src.stop(t0+d+0.05);
  }
  const semi=(base,s)=>base*Math.pow(2,s/12);
  const SCALE=[0,2,4,7,9,12,14,16,19,21,24]; // major pentatonic, climbs as you find queens
  return {
    unlock(){ensure();},
    mark(){noise({d:0.04,v:0.16,hp:2600});tone({f:1250,d:0.05,v:0.05});},
    unmark(){noise({d:0.03,v:0.1,hp:1500});tone({f:800,d:0.04,v:0.03});},
    tick(){const now=performance.now();if(now-lastTick<35)return;lastTick=now;noise({d:0.025,v:0.08,hp:3500});},
    ui(){noise({d:0.025,v:0.07,hp:2200});},
    queen(k){
      const f=semi(523.25,SCALE[Math.min(k-1,SCALE.length-1)]);
      tone({f,type:'triangle',d:0.42,v:0.22});
      tone({f:f*2,d:0.3,v:0.06,at:0.01});
      tone({f:f*1.5,d:0.5,v:0.1,at:0.07});
      noise({d:0.06,v:0.05,hp:6000,at:0.01});
    },
    wrong(){
      tone({f:220,to:85,type:'sawtooth',d:0.34,v:0.17,lp:900});
      tone({f:233,to:90,type:'square',d:0.3,v:0.05,lp:600});
      noise({d:0.14,v:0.14,hp:250});
    },
    hint(){[0,4,7,12,16].forEach((x,i)=>tone({f:semi(1046.5,x),at:i*0.045,d:0.3,v:0.08}));},
    win(){
      [0,4,7,12].forEach((x,i)=>tone({f:semi(523.25,x),type:'triangle',at:i*0.1,d:0.45,v:0.18}));
      [0,4,7,12,16].forEach(x=>tone({f:semi(523.25,x),at:0.42,d:1.3,v:0.06,a:0.02}));
      noise({at:0.42,d:0.5,v:0.04,hp:7000});
    },
    star(i){const f=semi(880,[0,4,7][i]||0);tone({f,type:'triangle',d:0.35,v:0.16});tone({f:f*2,d:0.25,v:0.05,at:0.02});},
    over(){[0,-3,-7,-12].forEach((x,i)=>tone({f:semi(392,x),type:'triangle',at:i*0.17,d:0.5,v:0.16,lp:1800}));}
  };
})();

/* ---------- Visual effects: glass shards, sparks and confetti on a canvas ---------- */
const FX=(()=>{
  const cv=$('fx'),g=cv.getContext('2d');
  let parts=[],raf=0,last=0,dpr=1;
  function resize(){dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);}
  resize();addEventListener('resize',resize);
  const rand=(a,b)=>a+Math.random()*(b-a);
  const off=()=>reduceMotion.matches;
  function css(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()||'#888';}
  function add(p){parts.push(p);if(!raf){last=performance.now();raf=requestAnimationFrame(step);}}
  function step(now){
    const dt=Math.min(0.033,(now-last)/1000);last=now;
    g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(p=>(p.age+=dt)<p.life);
    for(const p of parts){
      const k=Math.pow(p.drag,dt*60);
      p.vx*=k;p.vy=p.vy*k+p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
      g.globalAlpha=Math.min(1,1-(p.age-p.life*0.6)/(p.life*0.4));
      g.save();g.translate(p.x,p.y);g.rotate(p.rot);
      if(p.kind==='spark'){
        g.fillStyle=p.color;g.beginPath();g.arc(0,0,p.size*(1-0.6*p.age/p.life),0,Math.PI*2);g.fill();
      }else if(p.kind==='confetti'){
        g.scale(1,Math.cos(p.age*p.flip));g.fillStyle=p.color;g.fillRect(-p.size/2,-p.size*0.8,p.size,p.size*1.6);
      }else{
        g.fillStyle=p.color;g.strokeStyle=p.edge;g.lineWidth=1.3;g.lineJoin='round';
        g.beginPath();g.moveTo(p.pts[0],p.pts[1]);g.lineTo(p.pts[2],p.pts[3]);g.lineTo(p.pts[4],p.pts[5]);g.closePath();g.fill();g.stroke();
      }
      g.restore();
    }
    g.globalAlpha=1;
    if(parts.length)raf=requestAnimationFrame(step);
    else{raf=0;g.clearRect(0,0,innerWidth,innerHeight);}
  }
  return {
    css,
    shards(x,y,colors,count=14,power=1){
      if(off())return;
      const edge=css('--lead');
      for(let i=0;i<count;i++){
        const a=rand(0,Math.PI*2),sp=rand(120,340)*power,sz=rand(4,9);
        add({kind:'shard',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-140*power,grav:1100,drag:0.975,
          rot:rand(0,6.3),vr:rand(-12,12),age:0,life:rand(0.55,0.95),color:colors[i%colors.length],edge,
          pts:[rand(-sz,0),-sz,sz,rand(-sz/2,sz/2),rand(-sz,0),sz]});
      }
    },
    sparks(x,y,color,count=12,speed=260){
      if(off())return;
      for(let i=0;i<count;i++){
        const a=rand(0,Math.PI*2),sp=rand(0.35,1)*speed;
        add({kind:'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,grav:240,drag:0.91,rot:0,vr:0,age:0,
          life:rand(0.4,0.8),size:rand(1.6,3.2),color});
      }
    },
    confetti(x,y,colors,count,angle,spread,speed){
      if(off())return;
      for(let i=0;i<count;i++){
        const a=angle+rand(-spread,spread),sp=rand(0.55,1)*speed;
        add({kind:'confetti',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,grav:760,drag:0.982,rot:rand(0,6.3),
          vr:rand(-9,9),age:0,life:rand(1.7,2.8),size:rand(5,8),flip:rand(5,13),color:colors[i%colors.length]});
      }
    },
    clear(){parts=[];}
  };
})();

  const start=P.last||1;
  for(let L=start;L<=MAX_LEVEL;L++)if(!P.stars[L])return L;
  for(let L=1;L<start;L++)if(!P.stars[L])return L;
  return start;
}
function renderHome(){
  const done=completedCount();
  const stars=Object.values(P.stars).reduce((a,b)=>a+b,0);
  $('summary').textContent=done
    ?`${done} of ${MAX_LEVEL} levels complete, with ${stars} of ${MAX_LEVEL*3} stars.`
    :`${MAX_LEVEL} levels, growing from 5 × 5 boards to 11 × 11. Every level is open, so start anywhere.`;
  const nxt=nextLevel();
  const cont=$('continue');
  cont.textContent=done===MAX_LEVEL?`Replay level ${nxt}`:`Play level ${nxt}`;
  cont.onclick=()=>openLevel(nxt);
  $('rules-home').open=done===0;

  let html='';
  for(const b of BANDS){
    html+=`<section class="band"><div class="band-head"><h2>${b.n} × ${b.n}</h2><span>Levels ${b.from} to ${b.to}</span></div><div class="tiles">`;
    for(let L=b.from;L<=b.to;L++){
      const st=P.stars[L]||0,current=!st&&L===nxt;
      const cls=(st?'done':current?'current':'')+(L===S.justDone?' fresh':'');
      const label=st?`Level ${L}, ${st} ${st===1?'star':'stars'}`:`Level ${L}`;
      const starsHtml=st?`<span class="tstars">${starSvg(st>=1)}${starSvg(st>=2)}${starSvg(st>=3)}</span>`:'';
      html+=`<button class="tile ${cls}" data-level="${L}" style="--c:var(--r${b.color})" aria-label="${label}">${L}${starsHtml}</button>`;
    }
    html+='</div></section>';
  }
  $('bands').innerHTML=html;
  S.justDone=0;
}
$('bands').addEventListener('click',e=>{
  const t=e.target.closest('.tile');
  if(t){Sound.ui();openLevel(+t.dataset.level);}
});
let resetArmed=0;
$('reset').addEventListener('click',()=>{
  const btn=$('reset');
  if(!resetArmed){
    btn.textContent='Tap again to erase all progress';
    resetArmed=setTimeout(()=>{resetArmed=0;btn.textContent='Reset progress';},3500);
    return;
  }
  clearTimeout(resetArmed);resetArmed=0;
  P={stars:{},best:{},autoX:P.autoX,sound:P.sound,last:1};
  S.level=0;S.cells=null;
  saveProgress();
  btn.textContent='Reset progress';
  renderHome();
});

/* ---------- Opening a level ---------- */
function openLevel(L,fresh){
  closeDialog();
  showPlay();
  if(P.last!==L){P.last=L;saveProgress();}
  if(!fresh&&S.level===L&&active()){resumeTimer();render();return;}
  pauseTimer();
  FX.clear();
  Object.assign(S,{level:L,n:sizeFor(L),loading:true,done:false,over:false,lives:3,hintsLeft:1,
    cells:null,hist:[],acc:0,running:false,msg:null,streak:0});
  lastTap={i:-1,t:0,prev:0,pushed:false};
  $('level-title').textContent=`Level ${L}`;
  $('level-size').textContent=`${S.n} × ${S.n} board`;
  board.classList.add('busy');
  board.classList.remove('won','lost');
  loadingEl.textContent=`Building level ${L}…`;
  loadingEl.classList.add('show');
  livesEl.dataset.v='';
  render();
  const req=++S.req;
  getPuzzle(L,p=>{
    if(req!==S.req)return;
    S.reg=p.reg;S.sol=p.sol;S.colors=p.colors;
    S.cells=new Uint8Array(S.n*S.n);
    S.loading=false;S.focus=0;
    buildBoard();
    board.classList.remove('busy');
    loadingEl.classList.remove('show');
    resumeTimer();
    render();
    prefetch(L+1);
  });
}

function buildBoard(){
  const n=S.n;
  board.style.setProperty('--n',n);
  board.classList.toggle('dense',n>=10);
  board.innerHTML='';
  cellEls=[];cellKeys=new Array(n*n).fill(null);
  for(let i=0;i<n*n;i++){
    const r=i/n|0,c=i%n,g=S.reg[i];
    const el=document.createElement('button');
    el.type='button';
    el.className='cell';
    el.dataset.i=i;
    el.setAttribute('role','gridcell');
    el.tabIndex=i===S.focus?0:-1;
    el.style.setProperty('--c',`var(--r${S.colors[g]})`);
    el.style.setProperty('--d',`${r*70}ms`);
    if(c===n-1)el.classList.add('er');else if(S.reg[i+1]!==g)el.classList.add('br');
    if(r===n-1)el.classList.add('eb');else if(S.reg[i+n]!==g)el.classList.add('bb');
    board.appendChild(el);
    cellEls.push(el);
  }
}

/* ---------- Rendering ---------- */
function blockedMap(){
  if(!P.autoX||!S.cells)return null;
  const n=S.n,reg=S.reg,out=new Uint8Array(n*n);
  let any=false;
  for(let Q=0;Q<n*n;Q++){
    if(S.cells[Q]!==2)continue;
    any=true;
    const rq=Q/n|0,cq=Q%n,gq=reg[Q];
    for(let i=0;i<n*n;i++){
      const r=i/n|0,c=i%n;
      if(r===rq||c===cq||reg[i]===gq||(Math.abs(r-rq)<=1&&Math.abs(c-cq)<=1))out[i]=1;
    }
  }
  return any?out:null;
}
function render(){
  if(S.cells&&!S.loading){
    const n=S.n,blocked=blockedMap();
    for(let i=0;i<n*n;i++){
      const v=S.cells[i];
      const key=v===2?'q':v===3?'m':v===1?'x':(blocked&&blocked[i]?'ax':'');
      if(cellKeys[i]===key)continue;
      cellKeys[i]=key;
      const el=cellEls[i];
      el.innerHTML=key==='q'?CROWN:key==='m'?MISS:key==='x'?XMARK:key==='ax'?AUTOX:'';
      const what=v===2?'queen':v===3?'wrong guess':v===1?'marked':'empty';
      el.setAttribute('aria-label',`Row ${(i/n|0)+1}, column ${i%n+1}, ${what}`);
    }
  }
  renderLives();
  const queens=S.cells?S.cells.reduce((a,v)=>a+(v===2),0):0;
  const marks=S.cells?S.cells.some(v=>v===1):false;
  let text='',alert=false;
  if(S.loading)text='';
  else if(S.done)text=`Level complete in ${fmt(elapsed())}`;
  else if(S.over)text='Out of lives';
  else if(S.msg){text=S.msg.text;alert=S.msg.alert;}
  else if(S.level<=3&&!queens&&!marks)text='Tap to mark ✕. Double-tap to place a queen.';
  else text=`${queens} of ${S.n} queens found`;
  statusEl.textContent=text;
  statusEl.classList.toggle('alert',alert);
  $('undo').disabled=!active()||!S.hist.length;
  $('clear').disabled=!active()||!marks;
  $('hint').disabled=!active()||S.hintsLeft<1;
  $('hint').textContent=`Hint (${S.hintsLeft})`;
  $('autox').checked=P.autoX;
}
function renderLives(){
  const v=String(S.lives);
  if(livesEl.dataset.v===v)return;
  const prev=livesEl.dataset.v===''?3:+livesEl.dataset.v;
  livesEl.dataset.v=v;
  let h='';
  for(let k=0;k<3;k++){
    const alive=k<S.lives,breaking=!alive&&k<prev;
    h+=`<svg class="heart${alive?'':' gone'}${breaking?' breaking':''}" viewBox="0 0 24 24" aria-hidden="true"><path d="${HEART_D}"/></svg>`;
  }
  livesEl.innerHTML=h;
  livesEl.setAttribute('aria-label',`${S.lives} ${S.lives===1?'life':'lives'} left`);
}
function setMsg(text,alert,ms){
  clearTimeout(S.msgTimer);
  S.msg=text?{text,alert:!!alert}:null;
  if(text)S.msgTimer=setTimeout(()=>{S.msg=null;render();},ms||2800);
}
function pulse(i,cls){
  const el=cellEls[i];if(!el)return;
  el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);
  setTimeout(()=>el.classList.remove(cls),1200);
}

/* ---------- Moves ---------- */
function pushHist(snap){S.hist.push(snap);if(S.hist.length>500)S.hist.shift();}
function sameAs(snap){for(let i=0;i<snap.length;i++)if(snap[i]!==S.cells[i])return false;return true;}

function toggleMark(i){
  const v=S.cells[i];
  if(v>1)return false;
  pushHist(S.cells.slice());
  S.cells[i]=v?0:1;
  return true;
}
function tryQueen(i){
  if(!active())return;
  const v=S.cells[i];
  if(v>1)return;
  const r=i/S.n|0,c=i%S.n;
  if(S.sol[r]===c){
    S.cells[i]=2;
    S.streak++;
    const found=S.cells.reduce((a,x)=>a+(x===2),0);
    setMsg(null);
    render();
    queenEffects(i,found);
    if(found===S.n)levelComplete();
    else if(S.streak>=3&&S.streak%2===1)floater(cellEls[i],`${S.streak} in a row`,'good');
  }else{
    S.cells[i]=3;
    S.lives--;
    S.streak=0;
    buzz(80);
    Sound.wrong();
    pulse(i,'oops');
    shakeBoard();
    floater(cellEls[i],'−1 life','bad');
    if(S.lives>0)setMsg(`Wrong square. ${S.lives} ${S.lives===1?'life':'lives'} left.`,true);
    else setMsg(null);
    render();
    const heart=livesEl.children[S.lives];
    if(heart){const [hx,hy]=centerOf(heart);FX.shards(hx,hy,[FX.css('--heart')],12,0.7);}
    if(S.lives<=0)gameOver();
  }
}
function queenEffects(i,found){
  const el=cellEls[i];
  pulse(i,'set');
  regionGlow(i);
  Sound.queen(found);
  buzz(12);
  const [x,y]=centerOf(el);
  FX.shards(x,y,[FX.css(`--r${S.colors[S.reg[i]]}`),FX.css('--gold')],14,0.9);
  FX.sparks(x,y,FX.css('--gold'),10,220);
}
function undo(){
  if(!active()||!S.hist.length)return;
  const snap=S.hist.pop();
  // Only marks come back; queens and wrong guesses stay put.
  for(let i=0;i<snap.length;i++)if(S.cells[i]<=1)S.cells[i]=snap[i]<=1?snap[i]:0;
  Sound.unmark();
  lastTap.i=-1;setMsg(null);render();
}
function clearMarks(){
  if(!active())return;
  const snap=S.cells.slice();
  for(let i=0;i<S.cells.length;i++)if(S.cells[i]===1)S.cells[i]=0;
  if(!sameAs(snap)){pushHist(snap);Sound.ui();}
  lastTap.i=-1;render();
}
function hint(){
  if(!active()||S.hintsLeft<1)return;
  const n=S.n,rows=[];
  for(let r=0;r<n;r++)if(S.cells[r*n+S.sol[r]]!==2)rows.push(r);
  if(!rows.length)return;
  const r=rows[Math.random()*rows.length|0],i=r*n+S.sol[r];
  S.hintsLeft--;
  S.cells[i]=2;
  setMsg('Here’s one queen from the solution.');
  render();
  pulse(i,'flash');
  Sound.hint();
  const found=S.cells.reduce((a,x)=>a+(x===2),0);
  queenEffects(i,found);
  const [x,y]=centerOf(cellEls[i]);
  FX.sparks(x,y,FX.css('--gold'),22,360);
  if(found===n)levelComplete();
}

/* ---------- Pointer input: tap marks, double-tap places a queen, drag marks many ---------- */
function cellAt(x,y){
  const t=document.elementFromPoint(x,y);
  const el=t&&t.closest?t.closest('.cell'):null;
  return el&&board.contains(el)?+el.dataset.i:-1;
}
function paint(i){
  if(drag.mode==='mark'&&S.cells[i]===0){S.cells[i]=1;Sound.tick();}
  else if(drag.mode==='erase'&&S.cells[i]===1){S.cells[i]=0;Sound.tick();}
}
function paintLine(a,b){
  const n=S.n,r0=a/n|0,c0=a%n,r1=b/n|0,c1=b%n;
  const steps=Math.max(Math.abs(r1-r0),Math.abs(c1-c0));
  for(let s=1;s<=steps;s++)paint(Math.round(r0+(r1-r0)*s/steps)*n+Math.round(c0+(c1-c0)*s/steps));
}
function handleTap(i){
  const now=performance.now();
  if(lastTap.i===i&&now-lastTap.t<DOUBLE_TAP_MS){
    // Second tap: undo the first tap's mark, then place the queen.
    if(lastTap.pushed){S.cells[i]=lastTap.prev;S.hist.pop();}
    lastTap={i:-1,t:0,prev:0,pushed:false};
    tryQueen(i);
    return;
  }
  const prev=S.cells[i];
  const pushed=toggleMark(i);
  lastTap={i,t:now,prev,pushed};
  if(pushed){setMsg(null);S.cells[i]?Sound.mark():Sound.unmark();}
  render();
}
board.addEventListener('pointerdown',e=>{
  if(!active())return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  const el=e.target.closest('.cell');if(!el)return;
  e.preventDefault();
  const i=+el.dataset.i;
  moveFocus(i,false);
  drag={id:e.pointerId,start:i,last:i,moved:false,mode:S.cells[i]===1?'erase':'mark',snap:S.cells.slice()};
  try{board.setPointerCapture(e.pointerId);}catch(_){}
});
board.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id||!active())return;
  const i=cellAt(e.clientX,e.clientY);
  if(i<0||i===drag.last)return;
  if(!drag.moved){drag.moved=true;paint(drag.start);}
  paintLine(drag.last,i);
  drag.last=i;
  render();
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;
  if(!active())return;
  if(d.moved){
    if(!sameAs(d.snap)){pushHist(d.snap);setMsg(null);}
    lastTap.i=-1;
    render();
  }else if(!cancel){
    handleTap(d.start);
  }
}
board.addEventListener('pointerup',e=>endDrag(e,false));
board.addEventListener('pointercancel',e=>endDrag(e,true));
board.addEventListener('contextmenu',e=>e.preventDefault());
board.addEventListener('dblclick',e=>e.preventDefault());

/* ---------- Keyboard input ---------- */
function moveFocus(i,doFocus=true){
  if(!cellEls[i])return;
  if(cellEls[S.focus])cellEls[S.focus].tabIndex=-1;
  S.focus=i;cellEls[i].tabIndex=0;
  if(doFocus)cellEls[i].focus();
}
board.addEventListener('keydown',e=>{
  if(S.loading||!cellEls.length)return;
  const n=S.n,i=S.focus,r=i/n|0,c=i%n;
  const moves={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
  if(moves[e.key]){
    e.preventDefault();
    const [dr,dc]=moves[e.key];
    moveFocus(Math.min(n-1,Math.max(0,r+dr))*n+Math.min(n-1,Math.max(0,c+dc)));
    return;
  }
  if(!active())return;
  const k=e.key.toLowerCase();
  if(k===' '||k==='x'){e.preventDefault();if(toggleMark(i)){setMsg(null);S.cells[i]?Sound.mark():Sound.unmark();render();}}
  else if(k==='enter'||k==='q'){e.preventDefault();tryQueen(i);}
  else if((k==='backspace'||k==='delete')&&S.cells[i]===1){e.preventDefault();toggleMark(i);render();}
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!playEl.hidden){e.preventDefault();undo();}
  if(e.key==='Escape'&&!dlg.hidden)closeDialog();
});

/* ---------- Level end ---------- */
function levelComplete(){
  S.done=true;pauseTimer();
  const L=S.level,t=Math.round(elapsed()),stars=S.lives;
  const prevBest=P.best[L];
  P.stars[L]=Math.max(P.stars[L]||0,stars);
  if(!prevBest||t<prevBest)P.best[L]=t;
  S.justDone=L;
  saveProgress();
  board.classList.add('won');
  render();
  winEffects();

  let text=`Time ${fmt(t)}.`;
  if(prevBest&&t<prevBest)text=`Time ${fmt(t)}, a new best.`;
  else if(prevBest)text=`Time ${fmt(t)}. Your best is ${fmt(prevBest)}.`;
  if(stars===3)text+=' Flawless, no lives lost.';
  else text+=` Finish without losing a life for ${stars===2?'the third star':'more stars'}.`;
  if(L<MAX_LEVEL&&sizeFor(L+1)>S.n)text+=` Next up: ${sizeFor(L+1)} × ${sizeFor(L+1)} boards.`;

  setTimeout(()=>{
    if(!S.done||S.level!==L||playEl.hidden)return;
    if(L===MAX_LEVEL){
      openDialog({title:'All 200 levels complete',stars,text,main:['Levels',leavePlay]});
    }else{
      openDialog({title:`Level ${L} complete`,stars,text,main:['Next level',()=>openLevel(L+1)],alt:['Levels',leavePlay]});
    }
  },reduceMotion.matches?0:1300);
}
function gameOver(){
  S.over=true;pauseTimer();
  const L=S.level;
  board.classList.add('lost');
  setTimeout(()=>Sound.over(),380);
  setTimeout(()=>{
    if(!S.over||S.level!==L||playEl.hidden)return;
    openDialog({title:'Out of lives',text:`Level ${L} starts over with 3 fresh lives.`,
      main:['Try again',()=>openLevel(L,true)],alt:['Levels',leavePlay]});
  },reduceMotion.matches?0:700);
}

function winEffects(){
  setTimeout(()=>Sound.win(),260);
  if(reduceMotion.matches)return;
  const r=board.getBoundingClientRect(),cols=[...levelColors(),FX.css('--gold')];
  setTimeout(()=>{
    FX.confetti(r.left+8,r.bottom-8,cols,70,-Math.PI*0.36,0.32,1050);
    FX.confetti(r.right-8,r.bottom-8,cols,70,-Math.PI*0.64,0.32,1050);
  },320);
  setTimeout(()=>FX.confetti(r.left+r.width/2,r.top+r.height*0.45,cols,50,-Math.PI/2,1.2,620),700);
}

/* ---------- Dialog ---------- */
function openDialog({title,stars,text,main,alt}){
  $('dlg-title').textContent=title;
  const st=$('dlg-stars');
  if(stars){
    st.innerHTML=[1,2,3].map(k=>starSvg(k<=stars)).join('');
    st.querySelectorAll('.on').forEach((p,k)=>{
      p.style.animationDelay=`${k*180}ms`;
      setTimeout(()=>{
        if(dlg.hidden)return;
        Sound.star(k);
        const [x,y]=centerOf(p.closest('svg'));
        FX.sparks(x,y,FX.css('--gold'),14,240);
      },k*180+120);
    });
  }else st.innerHTML='';
  $('dlg-text').textContent=text;
  const m=$('dlg-main'),a=$('dlg-alt');
  m.textContent=main[0];m.onclick=()=>{Sound.ui();main[1]();};
  if(alt){a.hidden=false;a.textContent=alt[0];a.onclick=()=>{Sound.ui();alt[1]();};}else a.hidden=true;
  $('dlg-actions').classList.toggle('single',!alt);
  dlg.hidden=false;
  m.focus();
}
function closeDialog(){dlg.hidden=true;}
dlg.addEventListener('click',e=>{if(e.target===dlg)closeDialog();});

/* ---------- Controls ---------- */
$('undo').addEventListener('click',undo);
$('clear').addEventListener('click',clearMarks);
$('hint').addEventListener('click',hint);
$('autox').addEventListener('change',e=>{P.autoX=e.target.checked;saveProgress();render();});

/* ---------- Start ---------- */
renderSoundButtons();
renderHome();
loadProgress().then(()=>{renderSoundButtons();renderHome();render();prefetch(nextLevel());});
</script>
